<text class="copy" x="569" y="808" text-anchor="start" font-size="18" font-weight="650" fill="#344054">게임 벤치마크는 로봇·산업 설비 안전성</text>
<text class="copy" x="569" y="832" text-anchor="start" font-size="18" font-weight="650" fill="#344054">증거가 아닙니다. 긴 컨텍스트나 다중</text>
<text class="copy" x="569" y="856" text-anchor="start" font-size="18" font-weight="650" fill="#344054">이미지 입력 설정도 실행 메모리 요구량과</text>
<text class="copy" x="569" y="880" text-anchor="start" font-size="18" font-weight="650" fill="#344054">같지 않습니다. 실제 도구 연결 전에는</text>
