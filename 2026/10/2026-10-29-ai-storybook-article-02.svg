<text class="copy" x="370" y="452" text-anchor="start" font-size="22" font-weight="650" fill="#344054">입력을 선택하는 4B급 행동 예측 모델입니다.</text>
<circle cx="378" cy="488" r="5.5" fill="#667085"/>
<text class="copy" x="396" y="495" text-anchor="start" font-size="22" font-weight="650" fill="#344054">GUI·게임 에이전트 연구에 참고할 수</text>
