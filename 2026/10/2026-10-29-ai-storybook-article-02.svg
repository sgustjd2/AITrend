<text class="copy" x="396" y="569" text-anchor="start" font-size="22" font-weight="650" fill="#344054">모델 파일은 BF16이며 저장소의 가중치 파일</text>
<text class="copy" x="396" y="600" text-anchor="start" font-size="22" font-weight="650" fill="#344054">합은 약 10.35GB입니다.</text>
